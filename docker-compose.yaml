services:
  tigrcorn-com:
    build: .
    container_name: tigrcorn-com
    restart: unless-stopped
    labels:
      site.host: tigrcorn.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      tigrcorn-com-private: {}
      portwyrm-edge:
        aliases:
          - tigrcorn-com

networks:
  tigrcorn-com-private:
    name: tigrcorn-com-private
    internal: true
  portwyrm-edge:
    name: portwyrm-edge
    external: true
